<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menu</title>
<meta name="theme-color" content="#3B352F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #F4F2ED;   /* warm off-white — the wall in the reference */
    --paper-2:  #EAE6DE;   /* image beds, empty states */
    --band:     #3B352F;   /* dark header band */
    --ink:      #2A2521;   /* body text */
    --ink-soft: #6E655C;   /* descriptions, meta */
    --rule:     #C6BEB2;   /* dotted dividers */
    --clay:     #B4553A;   /* the stool. used sparingly */
    --serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-size: 17px;
    line-height: 1.5;
  }
  img { display: block; max-width: 100%; }

  .label {
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase;
  }

  /* ── HEADER BAND ── */
  .band {
    background: var(--band); color: var(--paper);
    padding: 26px 22px 24px; text-align: center;
  }
  .band img { height: 44px; width: auto; margin: 0 auto 12px; object-fit: contain; }
  .band-title {
    font-size: 34px; font-weight: 400;
    letter-spacing: .26em; text-transform: uppercase;
    text-indent: .26em; line-height: 1;
  }
  .band-sub {
    font-family: var(--sans);
    font-size: 9.5px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(244,242,237,.6); margin-top: 12px;
  }

  /* ── ROTATOR ── */
  .rot-stage {
    position: relative; aspect-ratio: 4 / 5;
    overflow: hidden; background: var(--paper-2);
  }
  .rot-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .55s ease; }
  .rot-slide.on { opacity: 1; }
  .rot-slide img { width: 100%; height: 100%; object-fit: cover; }
  .mark-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; color: var(--rule);
  }
  .rot-arrow {
    position: absolute; bottom: 0; z-index: 5;
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); border: 0; color: var(--ink);
    cursor: pointer; transition: background .2s;
  }
  .rot-arrow:hover { background: #fff; }
  .rot-arrow:focus-visible { outline: 2px solid var(--clay); outline-offset: -4px; }
  .rot-arrow.prev { left: 0; }
  .rot-arrow.next { right: 0; }
  .rot-arrow svg { width: 22px; height: 12px; }

  .rot-caption {
    display: flex; gap: 20px; align-items: flex-start;
    padding: 24px 22px 28px;
  }
  .rot-cap-body { flex: 1; min-width: 0; }
  .rot-cap-index {
    font-family: var(--sans); font-size: 11px; font-weight: 500;
    color: var(--ink-soft); letter-spacing: .06em;
    margin-right: 12px; vertical-align: 3px;
  }
  .rot-cap-name { font-size: 29px; font-weight: 500; line-height: 1.12; display: inline; letter-spacing: -.005em; }
  .rot-cap-desc { color: var(--ink-soft); font-size: 16.5px; line-height: 1.55; margin-top: 12px; max-width: 46ch; }
  .rot-cap-price { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .1em; margin-top: 12px; }
  .rot-cap-thumb { width: 108px; height: 128px; flex-shrink: 0; background: var(--paper-2); overflow: hidden; }
  .rot-cap-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .rot-cap-thumb .mark-fallback { font-size: 28px; }

  /* ── FILTERS ── */
  .filters {
    position: sticky; top: 0; z-index: 40;
    background: var(--paper);
    border-top: 1px dotted var(--rule);
    border-bottom: 1px dotted var(--rule);
  }
  .filter-inner { max-width: 940px; margin: 0 auto; padding: 0 22px; }
  .filter-row { display: flex; gap: 26px; overflow-x: auto; padding: 15px 0; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-btn {
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    background: none; border: 0; padding: 0 0 4px;
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
    border-bottom: 1.5px solid transparent;
    transition: color .18s, border-color .18s;
  }
  .filter-btn:hover { color: var(--ink); }
  .filter-btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
  .filter-btn.on { color: var(--clay); border-bottom-color: var(--clay); }
  .filter-btn .n { font-weight: 400; opacity: .55; margin-left: 5px; letter-spacing: .06em; }

  .temp-row { display: flex; gap: 20px; padding: 12px 0 13px; border-top: 1px dotted var(--rule); }
  .temp-row:empty { display: none; }
  .temp-btn {
    font-family: var(--sans);
    font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: 0; padding: 0;
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .temp-btn:hover { color: var(--ink); }
  .temp-btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
  .temp-btn.on { color: var(--clay); font-weight: 700; }

  /* ── SEARCH ── */
  .search-wrap { max-width: 940px; margin: 0 auto; padding: 18px 22px 0; }
  .search-input {
    width: 100%; font-family: var(--serif); font-size: 17px;
    padding: 10px 0; border: 0; border-bottom: 1px solid var(--rule);
    background: none; color: var(--ink); outline: none;
  }
  .search-input:focus { border-bottom-color: var(--clay); }
  .search-input::placeholder { color: var(--ink-soft); font-style: italic; }

  /* ── MENU ── */
  .menu { max-width: 940px; margin: 0 auto; padding: 8px 22px 40px; }
  .cat-head { display: flex; align-items: baseline; gap: 14px; padding: 34px 0 4px; }
  .cat-head h2 { font-size: 24px; font-weight: 500; }
  .cat-head .label { color: var(--ink-soft); }

  .item { padding: 26px 0 28px; border-top: 1px dotted var(--rule); }
  .item-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  .item-num { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-soft); letter-spacing: .06em; flex-shrink: 0; }
  .item-name { font-size: 25px; font-weight: 500; line-height: 1.15; flex: 1; min-width: 0; letter-spacing: -.005em; }
  .item-price { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .08em; flex-shrink: 0; }
  .item-img { aspect-ratio: 3 / 2; background: var(--paper-2); overflow: hidden; margin-bottom: 16px; }
  .item-img img { width: 100%; height: 100%; object-fit: cover; }
  .item-desc { color: var(--ink-soft); font-size: 16.5px; line-height: 1.58; max-width: 52ch; }
  .item-meta { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .meta-line { font-family: var(--sans); font-size: 12px; line-height: 1.55; color: var(--ink-soft); }
  .meta-line .label { display: block; color: var(--ink); margin-bottom: 3px; font-size: 9.5px; }
  .temp-mark {
    font-family: var(--sans); font-size: 9.5px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--clay); margin-left: 10px; white-space: nowrap;
  }
  .allergen {
    display: inline-block; margin: 0 6px 5px 0; padding: 2px 9px;
    border: 1px solid var(--rule); border-radius: 999px;
    font-size: 10.5px; letter-spacing: .06em;
  }

  .empty { text-align: center; padding: 70px 30px; color: var(--ink-soft); }
  .empty .mark { font-size: 40px; margin-bottom: 14px; opacity: .35; }
  .empty h3 { font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }

  .foot {
    border-top: 1px dotted var(--rule);
    max-width: 940px; margin: 0 auto;
    padding: 26px 22px 46px;
    font-family: var(--sans); font-size: 11px; line-height: 1.75;
    color: var(--ink-soft); text-align: center;
  }

  @media (min-width: 760px) {
    body { font-size: 18px; }
    .band { padding: 40px 22px 36px; }
    .band-title { font-size: 46px; }
    .rot-stage { aspect-ratio: 16 / 9; }
    .rotator { max-width: 940px; margin: 0 auto; }
    .rot-cap-name { font-size: 34px; }
    .list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="band">
  <img src="./otterspace.png" alt="" onerror="this.style.display='none'">
  <div class="band-title">Menu</div>
  <div class="band-sub">Coffee · Tea · Hot Drinks · Refreshments</div>
</header>

<section class="rotator" id="rotator" aria-label="Featured drinks" hidden>
  <div class="rot-stage" id="rotStage">
    <button class="rot-arrow prev" onclick="rotGo(-1)" aria-label="Previous drink">
      <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M23 6H1M1 6l6-5M1 6l6 5"/></svg>
    </button>
    <button class="rot-arrow next" onclick="rotGo(1)" aria-label="Next drink">
      <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 6h22M23 6l-6-5M23 6l-6 5"/></svg>
    </button>
  </div>
  <div class="rot-caption" id="rotCaption" aria-live="polite"></div>
</section>

<nav class="filters" aria-label="Menu filters">
  <div class="filter-inner">
    <div class="filter-row" id="filterRow"></div>
    <div class="temp-row" id="tempRow"></div>
  </div>
</nav>

<div class="search-wrap">
  <input class="search-input" id="searchInput" type="search" placeholder="Search the menu…" aria-label="Search the menu">
</div>

<main class="menu" id="menu"></main>

<div class="foot">
  Allergen information is a guide only.<br>Please tell us about any allergy before you order.
</div>

<script>
const CONFIG = {
  dataFile: "coffee_export.json",
  currency: "€",
  rotateEvery: 6000        // ms between slides — set to 0 to stop auto-advancing
};

const CATEGORIES = ["Coffee Based Drinks", "Teas", "Hot Beverages", "Refreshments"];
const CAT_LABEL = {
  "Coffee Based Drinks": "Coffee",
  "Teas": "Teas",
  "Hot Beverages": "Hot Drinks",
  "Refreshments": "Refreshments"
};
const FALLBACK = '<div class="mark-fallback">◍</div>';

let DRINKS = [];
let activeCategory = "All";
let activeTemp = "All";
let searchTerm = "";

/* ═══════════ LOAD ═══════════ */
function boot() {
  if (window.parent !== window) {
    window.parent.postMessage({ type: "previewReady" }, "*");
    setTimeout(() => { if (!DRINKS.length) loadFromFile(); }, 700);
  } else {
    loadFromFile();
  }
}

window.addEventListener("message", e => {
  if (e.data && e.data.type === "previewData") {
    DRINKS = normalize(e.data.payload);
    render();
  }
});

async function loadFromFile() {
  try {
    const res = await fetch(CONFIG.dataFile, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DRINKS = normalize(await res.json());
    render();
  } catch (e) {
    document.getElementById("menu").innerHTML =
      `<div class="empty"><div class="mark">◍</div><h3>The menu didn't load</h3><p>Check your connection and refresh the page.</p></div>`;
  }
}

function normalize(obj) {
  return Object.keys(obj)
    .filter(k => !k.startsWith("_"))
    .map(k => Object.assign({ name: k }, obj[k]))
    .filter(d => !d.hidden)
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
}

function photo(d, cls, eager) {
  if (!d.image) return FALLBACK;
  return `<img src="${esc(d.image)}" alt="${esc(cls === "thumb" ? "" : d.name)}"${eager ? "" : ' loading="lazy"'} onerror="this.parentElement.innerHTML=window.FALLBACK_HTML">`;
}
window.FALLBACK_HTML = FALLBACK;

/* ═══════════ ROTATOR ═══════════ */
let rotItems = [];
let rotIndex = 0;
let rotTimer = null;

function featured() {
  const tagged = DRINKS.filter(d => d.featured);
  // Nothing tagged yet — show a few with pictures so the top of the page isn't bare.
  return tagged.length ? tagged : DRINKS.filter(d => d.image).slice(0, 4);
}

function renderRotator() {
  rotItems = featured();
  const section = document.getElementById("rotator");
  if (!rotItems.length) { section.hidden = true; clearInterval(rotTimer); return; }
  section.hidden = false;

  const stage = document.getElementById("rotStage");
  stage.querySelectorAll(".rot-slide").forEach(n => n.remove());
  rotItems.forEach((d, i) => {
    const div = document.createElement("div");
    div.className = "rot-slide" + (i === 0 ? " on" : "");
    div.innerHTML = photo(d, "slide", i === 0);
    stage.insertBefore(div, stage.firstChild);
  });

  const single = rotItems.length < 2;
  stage.querySelectorAll(".rot-arrow").forEach(a => a.style.display = single ? "none" : "");

  rotIndex = 0;
  paintCaption();
  startAuto();
}

function paintCaption() {
  const d = rotItems[rotIndex];
  if (!d) return;
  document.getElementById("rotCaption").innerHTML = `
    <div class="rot-cap-body">
      <span class="rot-cap-index">${String(rotIndex + 1).padStart(2, "0")}</span><h2 class="rot-cap-name">${esc(d.name)}</h2>
      ${d.description ? `<p class="rot-cap-desc">${esc(d.description)}</p>` : ""}
      <div class="rot-cap-price">${CONFIG.currency}${esc(d.price || "—")}${d.temp ? `<span class="temp-mark">${esc(d.temp)}</span>` : ""}</div>
    </div>
    <div class="rot-cap-thumb">${photo(d, "thumb", false)}</div>`;
}

function rotGo(step) {
  if (rotItems.length < 2) return;
  rotIndex = (rotIndex + step + rotItems.length) % rotItems.length;
  document.querySelectorAll(".rot-slide").forEach((s, i) => s.classList.toggle("on", i === rotIndex));
  paintCaption();
  startAuto();
}

function startAuto() {
  clearInterval(rotTimer);
  if (!CONFIG.rotateEvery || rotItems.length < 2) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  rotTimer = setInterval(() => rotGo(1), CONFIG.rotateEvery);
}

(function () {
  let x0 = null;
  const stage = document.getElementById("rotStage");
  stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) rotGo(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
})();

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") rotGo(-1);
  if (e.key === "ArrowRight") rotGo(1);
});

/* ═══════════ FILTERS ═══════════ */
function renderFilters() {
  const counts = { All: DRINKS.length };
  CATEGORIES.forEach(c => counts[c] = DRINKS.filter(d => d.category === c).length);
  const items = [{ key: "All", label: "All" }]
    .concat(CATEGORIES.filter(c => counts[c] > 0).map(c => ({ key: c, label: CAT_LABEL[c] })));

  document.getElementById("filterRow").innerHTML = items
    .map(t => `<button class="filter-btn${activeCategory === t.key ? " on" : ""}" data-cat="${t.key}" aria-pressed="${activeCategory === t.key}">${t.label}<span class="n">${counts[t.key]}</span></button>`)
    .join("");

  const inCat = DRINKS.filter(d => activeCategory === "All" || d.category === activeCategory);
  const hot = inCat.filter(d => (d.temp || "Hot") === "Hot").length;
  const cold = inCat.filter(d => (d.temp || "Hot") === "Cold").length;
  const row = document.getElementById("tempRow");
  if (!hot || !cold) { row.innerHTML = ""; activeTemp = "All"; return; }
  row.innerHTML = [
    { key: "All", label: "Both" },
    { key: "Hot", label: "Hot " + hot },
    { key: "Cold", label: "Cold " + cold }
  ].map(t => `<button class="temp-btn${activeTemp === t.key ? " on" : ""}" data-temp="${t.key}" aria-pressed="${activeTemp === t.key}">${t.label}</button>`).join("");
}

document.getElementById("filterRow").addEventListener("click", e => {
  const btn = e.target.closest("[data-cat]");
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  activeTemp = "All";
  renderFilters(); renderMenu();
  document.querySelector(".filters").scrollIntoView({ block: "start" });
});

document.getElementById("tempRow").addEventListener("click", e => {
  const btn = e.target.closest("[data-temp]");
  if (!btn) return;
  activeTemp = btn.dataset.temp;
  renderFilters(); renderMenu();
});

document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderMenu();
});

/* ═══════════ MENU ═══════════ */
function visible() {
  return DRINKS.filter(d => {
    if (activeCategory !== "All" && d.category !== activeCategory) return false;
    if (activeTemp !== "All" && (d.temp || "Hot") !== activeTemp) return false;
    if (!searchTerm) return true;
    return (d.name || "").toLowerCase().includes(searchTerm)
        || (d.description || "").toLowerCase().includes(searchTerm)
        || (d.ingredients || "").toLowerCase().includes(searchTerm);
  });
}

function renderMenu() {
  const list = visible();
  const menu = document.getElementById("menu");

  if (!list.length) {
    menu.innerHTML = `<div class="empty"><div class="mark">◍</div><h3>Nothing here</h3><p>Try another filter, or clear the search.</p></div>`;
    return;
  }

  let n = 0;
  if (activeCategory !== "All") {
    menu.innerHTML = `<div class="list">${list.map(d => item(d, ++n)).join("")}</div>`;
    return;
  }

  menu.innerHTML = CATEGORIES.map(cat => {
    const items = list.filter(d => d.category === cat);
    if (!items.length) return "";
    return `<div class="cat-head"><h2>${CAT_LABEL[cat]}</h2><span class="label">${items.length}</span></div>
            <div class="list">${items.map(d => item(d, ++n)).join("")}</div>`;
  }).join("");
}

function item(d, n) {
  const allerg = Array.isArray(d.allergens) ? d.allergens : (d.allergens ? String(d.allergens).split(",").map(s => s.trim()).filter(Boolean) : []);
  return `<article class="item">
    <div class="item-head">
      <span class="item-num">${String(n).padStart(2, "0")}</span>
      <h3 class="item-name">${esc(d.name)}</h3>
      <span class="item-price">${CONFIG.currency}${esc(d.price || "—")}</span>
    </div>
    <div class="item-img">${photo(d, "item", false)}</div>
    ${d.description ? `<p class="item-desc">${esc(d.description)}${d.temp ? `<span class="temp-mark">${esc(d.temp)}</span>` : ""}</p>` : ""}
    ${(d.ingredients || allerg.length) ? `<div class="item-meta">
      ${d.ingredients ? `<div class="meta-line"><span class="label">Ingredients</span>${esc(d.ingredients)}</div>` : ""}
      ${allerg.length ? `<div class="meta-line"><span class="label">Allergens</span>${allerg.map(a => `<span class="allergen">${esc(a)}</span>`).join("")}</div>` : ""}
    </div>` : ""}
  </article>`;
}

function render() { renderRotator(); renderFilters(); renderMenu(); }

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

boot();
</script>
</body>
</html>
